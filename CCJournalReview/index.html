<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redirecting</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://forms.gle/RGxEuSnFN5jCYLhs6" />
<meta http-equiv="refresh" content="0; url=https://forms.gle/RGxEuSnFN5jCYLhs6" />
<!-- GitHub Pages cannot issue a real 301, so this is a meta refresh with a JS
     fallback. Background matches the site's --void so the bounce does not flash
     white. location.replace keeps the hop out of session history, so the back
     button returns where the visitor actually came from. -->
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #04060c; color: #7c8ca6;
    font: 15px/1.6 Inter, system-ui, -apple-system, sans-serif;
    display: grid; place-items: center; text-align: center; padding: 1.5rem;
  }
  a { color: #1e9bff; }
</style>
</head>
<body>
  <p>Redirecting to forms.gle. <a href="https://forms.gle/RGxEuSnFN5jCYLhs6">Continue</a></p>
  <script>location.replace("https://forms.gle/RGxEuSnFN5jCYLhs6");</script>
</body>
</html>
